[build-system]
requires = ["setuptools==79.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-management-follow-up-automation"
version = "0.1.0"
description = "MVP foundation for Gmail lead intake and sales follow-up automation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.149,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: tests requiring an isolated PostgreSQL target",
  "e2e: synthetic end-to-end workflow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
